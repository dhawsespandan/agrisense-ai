services:

  prometheus:
    image: prom/prometheus:latest
    container_name: agrisense-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: agrisense-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus